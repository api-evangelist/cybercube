aid: cybercube
name: CyberCube
description: 'CyberCube is a cyber risk analytics provider for the insurance industry
  — brokers, insurers, reinsurers and cyber ILS investors — translating cyber risk
  into quantified financial impact. Its product line spans Account Manager (single-risk
  underwriting), Portfolio Manager (portfolio aggregation and catastrophe loss modeling),
  Broking Manager, Exposure Manager, SPoF Intelligence (digital supply-chain single
  points of failure) and the Industry Exposure Databases. CyberConnect is the company''s
  API layer, marketed as a way to deliver CyberCube models, insights and signals into
  a customer''s own underwriting, exposure-management and capital-modeling workflows,
  spanning catastrophe risk management, risk scoring, financial loss modeling, reinsurance
  modeling, SPoF intelligence, risk intelligence and threat modeling. The CyberConnect
  reference and the Atlas documentation portal sit behind a customer login, and the
  production API host answers unauthenticated requests with an AWS API Gateway authentication
  challenge.'
